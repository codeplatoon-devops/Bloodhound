<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0b1220; }
      .subtitle { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #334155; }
      .label { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0b1220; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .tiny { font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #334155; }

      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 14; ry: 14; }
      .box-aws { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 16; ry: 16; }
      .box-callout { fill: #f1f5f9; stroke: #cbd5e1; stroke-width: 2; rx: 14; ry: 14; }
      .chip { fill: #e2e8f0; stroke: #94a3b8; stroke-width: 1.5; rx: 10; ry: 10; }

      .arrow { stroke: #0f172a; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .arrow-muted { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrowheadMuted); }
      .arrow-dashed { stroke: #0f172a; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowhead); }

      .note { fill: #0f172a; font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .note-muted { fill: #334155; font: 500 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0f172a"/>
    </marker>
    <marker id="arrowheadMuted" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1220" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <!-- Header -->
  <text x="50" y="70" class="title">Bloodhound v2 — Architecture and Logic Flow</text>
  <text x="50" y="98" class="subtitle">AWS resource scan + whitelist filter + budget projection + Slack alerts + optional teardown (with safety rails)</text>

  <!-- Left: Triggers -->
  <rect x="50" y="150" width="420" height="320" class="box" filter="url(#shadow)"/>
  <text x="70" y="185" class="label">Triggers</text>

  <rect x="80" y="210" width="360" height="90" class="box-callout"/>
  <text x="100" y="240" class="small">Scheduled (GitHub Actions or scheduler)</text>
  <text x="100" y="262" class="tiny">Invokes Lambda for scan + budget report</text>
  <text x="100" y="284" class="tiny">Recommended for regular visibility</text>

  <rect x="80" y="320" width="360" height="120" class="box-callout"/>
  <text x="100" y="350" class="small">On-demand (Slack slash commands)</text>
  <text x="100" y="372" class="tiny">Slack → Lambda Function URL (HTTPS)</text>
  <text x="100" y="394" class="tiny">Signature verification + replay protection</text>
  <text x="100" y="416" class="tiny">Responds quickly; runs worker async</text>

  <!-- Middle: Lambda -->
  <rect x="520" y="150" width="830" height="700" class="box-aws" filter="url(#shadow)"/>
  <text x="545" y="185" class="label">AWS Account (single account) — BloodhoundLambdaV2</text>
  <text x="545" y="208" class="tiny">Runtime: python3.10 • Handler: handlers.lambda_function.lambda_handler • Deployed via Terraform</text>

  <!-- Lambda entry points -->
  <rect x="560" y="240" width="370" height="160" class="box"/>
  <text x="580" y="272" class="small">HTTP Entry (Function URL)</text>
  <rect x="580" y="290" width="330" height="38" class="chip"/>
  <text x="595" y="314" class="tiny">bloodhound.slack_commands: verify + route (/seek, /seek_destroy)</text>
  <rect x="580" y="336" width="330" height="48" class="chip"/>
  <text x="595" y="357" class="tiny">Immediately returns 200 to Slack</text>
  <text x="595" y="375" class="tiny">Worker invoked async for full run</text>

  <rect x="980" y="240" width="330" height="160" class="box"/>
  <text x="1000" y="272" class="small">Scheduled / Direct Invoke</text>
  <rect x="1000" y="290" width="290" height="38" class="chip"/>
  <text x="1015" y="314" class="tiny">aws lambda invoke (CLI) or scheduler</text>
  <rect x="1000" y="336" width="290" height="48" class="chip"/>
  <text x="1015" y="357" class="tiny">Runs full scan + budget + teardown plan</text>
  <text x="1015" y="375" class="tiny">Optionally executes teardown (apply mode)</text>

  <!-- Core app -->
  <rect x="560" y="430" width="750" height="210" class="box"/>
  <text x="580" y="462" class="small">Core Orchestrator</text>
  <rect x="580" y="480" width="710" height="44" class="chip"/>
  <text x="595" y="507" class="tiny">bloodhound.app: load config → scan_all → whitelist → budget → messages → Slack posts</text>
  <rect x="580" y="532" width="345" height="92" class="chip"/>
  <text x="595" y="555" class="tiny">Config + safety rails</text>
  <text x="595" y="575" class="tiny">APPLY_CHANGES (default false)</text>
  <text x="595" y="595" class="tiny">TEARDOWN_SIMULATE, TEARDOWN_TARGET_IDS</text>
  <text x="595" y="615" class="tiny">TEARDOWN_ALLOW_ALL (dangerous)</text>
  <rect x="945" y="532" width="345" height="92" class="chip"/>
  <text x="960" y="555" class="tiny">Slack destinations</text>
  <text x="960" y="575" class="tiny">Scan channel: SLACK_SCAN_CHANNEL_ID</text>
  <text x="960" y="595" class="tiny">Alert channel: SLACK_ALERT_CHANNEL_ID</text>
  <text x="960" y="615" class="tiny">Posting via chat.postMessage</text>

  <!-- Scanning -->
  <rect x="560" y="670" width="360" height="160" class="box"/>
  <text x="580" y="700" class="small">Multi-region Scanning</text>
  <text x="580" y="722" class="tiny">bloodhound.scanner.scan_all + per-service scanners</text>
  <text x="580" y="746" class="tiny">Regions: explicit list or discovery mode</text>
  <text x="580" y="770" class="tiny">Resources scanned (examples):</text>
  <text x="600" y="792" class="tiny">- EC2 instances, EBS volumes, Elastic IPs</text>
  <text x="600" y="814" class="tiny">- RDS instances</text>
  <text x="600" y="836" class="tiny">- ELBv2 load balancers</text>

  <!-- Budget -->
  <rect x="950" y="670" width="360" height="160" class="box"/>
  <text x="970" y="700" class="small">Budget Projection</text>
  <text x="970" y="722" class="tiny">bloodhound.budget → AWS Cost Explorer</text>
  <text x="970" y="746" class="tiny">Cohort config: start YYYY-MM, total USD, length months</text>
  <text x="970" y="770" class="tiny">Dynamic monthly allowance using cohort-to-date spend</text>
  <text x="970" y="794" class="tiny">Over-budget threshold based on projected days over</text>

  <!-- Teardown -->
  <rect x="560" y="860" width="750" height="0" fill="none"/>

  <!-- Whitelist + Teardown (callout row under core) -->
  <rect x="560" y="850" width="360" height="0" fill="none"/>

  <!-- Whitelist + Teardown section (bottom area inside AWS box) -->
  <rect x="560" y="840" width="750" height="0" fill="none"/>

  <rect x="560" y="840" width="0" height="0" fill="none"/>

  <rect x="560" y="840" width="0" height="0" fill="none"/>

  <rect x="560" y="840" width="0" height="0" fill="none"/>

  <!-- Whitelist / Teardown overlay box (placed above bottom margin, inside AWS box) -->
  <rect x="560" y="840" width="750" height="0" fill="none"/>

  <rect x="560" y="840" width="750" height="0" fill="none"/>

  <rect x="560" y="840" width="750" height="0" fill="none"/>

  <!-- Separate row for whitelist + teardown (use remaining vertical space) -->
  <rect x="560" y="840" width="360" height="0" fill="none"/>

  <!-- Put whitelist + teardown just above the bottom edge of AWS box -->
  <rect x="560" y="840" width="750" height="0" fill="none"/>

  <rect x="560" y="840" width="750" height="0" fill="none"/>

  <rect x="560" y="840" width="750" height="0" fill="none"/>

  <rect x="560" y="840" width="750" height="0" fill="none"/>

  <!-- Whitelist + teardown boxes (actual) -->
  <rect x="560" y="840" width="360" height="0" fill="none"/>
  <rect x="560" y="840" width="360" height="0" fill="none"/>

  <!-- Since the AWS container ends at y=850, place these at y=835.. (tight but inside) -->
  <rect x="560" y="835" width="360" height="95" class="box" transform="translate(0,-95)"/>
  <rect x="950" y="835" width="360" height="95" class="box" transform="translate(0,-95)"/>

  <text x="580" y="870" class="small" transform="translate(0,-95)">Whitelist Filter</text>
  <text x="580" y="892" class="tiny" transform="translate(0,-95)">bloodhound.whitelist: KEEP_TAG_KEY / KEEP_TAG_VALUE</text>
  <text x="580" y="914" class="tiny" transform="translate(0,-95)">Kept resources are excluded from teardown</text>

  <text x="970" y="870" class="small" transform="translate(0,-95)">Teardown (optional)</text>
  <text x="970" y="892" class="tiny" transform="translate(0,-95)">bloodhound.teardown: planner + executor</text>
  <text x="970" y="914" class="tiny" transform="translate(0,-95)">Dry-run by default; apply requires explicit flags</text>

  <!-- External Slack -->
  <rect x="50" y="520" width="420" height="190" class="box" filter="url(#shadow)"/>
  <text x="70" y="555" class="label">Slack Workspace</text>
  <rect x="80" y="580" width="360" height="100" class="box-callout"/>
  <text x="100" y="610" class="small">Channels</text>
  <text x="100" y="632" class="tiny">Scan summaries + whitelisted list</text>
  <text x="100" y="654" class="tiny">Budget summaries + overage alerts</text>
  <text x="100" y="676" class="tiny">Teardown plan + results (when enabled)</text>

  <!-- Arrows: triggers to Lambda -->
  <path d="M 440 255 C 500 255, 500 285, 520 300" class="arrow"/>
  <text x="405" y="242" class="note-muted">invoke</text>

  <path d="M 440 385 C 490 385, 500 330, 520 320" class="arrow"/>
  <text x="360" y="405" class="note-muted">HTTPS request</text>

  <!-- Arrow: Slack box to HTTP entry -->
  <path d="M 470 630 C 520 630, 520 360, 560 320" class="arrow-muted"/>
  <text x="360" y="645" class="note-muted">/seek, /seek_destroy</text>

  <!-- Arrow: HTTP entry to core orchestrator (async worker) -->
  <path d="M 745 400 C 745 420, 735 420, 720 430" class="arrow-dashed"/>
  <text x="585" y="418" class="note-muted">async invoke worker</text>

  <!-- Arrow: Scheduled invoke to core orchestrator -->
  <path d="M 1145 400 C 1145 420, 1100 420, 1040 430" class="arrow"/>
  <text x="1045" y="418" class="note-muted">direct run</text>

  <!-- Arrow: core -> scanning -->
  <path d="M 740 640 C 740 655, 740 655, 740 670" class="arrow"/>
  <text x="590" y="660" class="note-muted">scan candidates</text>

  <!-- Arrow: scanning -> whitelist -->
  <path d="M 740 830 C 740 830, 650 790, 650 740" class="arrow-muted" transform="translate(0,-95)"/>
  <!-- (intentionally subtle; diagram already labels whitelist role) -->

  <!-- Arrow: core -> budget -->
  <path d="M 1040 640 C 1040 655, 1040 655, 1040 670" class="arrow"/>
  <text x="970" y="660" class="note-muted">fetch costs</text>

  <!-- Arrow: core -> Slack channels -->
  <path d="M 560 540 C 520 540, 520 630, 470 630" class="arrow"/>
  <text x="430" y="520" class="note-muted">chat.postMessage</text>

  <!-- Footer notes -->
  <rect x="50" y="745" width="420" height="105" class="box-callout"/>
  <text x="70" y="775" class="small">Safety rails for destructive actions</text>
  <text x="70" y="798" class="tiny">Default behavior posts a teardown plan only (APPLY_CHANGES=false).</text>
  <text x="70" y="820" class="tiny">Apply-mode supports simulate, explicit targets, or allow-all (dangerous).</text>
  <text x="70" y="842" class="tiny">Slash destroy requires a confirm token and optional allowlists.</text>
</svg>
